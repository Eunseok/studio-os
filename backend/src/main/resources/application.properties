server.address=127.0.0.1
server.port=${STUDIO_API_PORT:8080}
spring.datasource.url=${STUDIO_DB_URL:jdbc:h2:file:./data/studio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${STUDIO_DB_USER:sa}
spring.datasource.password=${STUDIO_DB_PASSWORD:}
spring.sql.init.mode=always
spring.mvc.async.request-timeout=35000
server.error.include-message=never
studio.data=${STUDIO_DATA:./data}
studio.codex=${STUDIO_CODEX:codex}
studio.allowed-origins=${STUDIO_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
studio.claude=${STUDIO_CLAUDE:claude}
studio.model.codex=${STUDIO_CODEX_MODEL:gpt-6.1-sol}
studio.model.claude=${STUDIO_CLAUDE_MODEL:sonnet}
studio.model.claude-deep=${STUDIO_CLAUDE_DEEP_MODEL:opus}
